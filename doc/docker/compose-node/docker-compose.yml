services:
  neurai:
    build:
      context: ./node
      args:
        NEURAI_REPOSITORY: https://github.com/NeuraiProject/Neurai.git
        NEURAI_REF: ${NEURAI_REF:-1.0.6}
    image: neurai-node:local
    restart: unless-stopped
    ports:
      - "${NEURAI_P2P_PORT:-19000}:${NEURAI_P2P_PORT:-19000}"
    environment:
      NEURAI_P2P_PORT: ${NEURAI_P2P_PORT:-19000}
      NEURAI_RPC_PORT: ${NEURAI_RPC_PORT:-19001}
      NEURAI_RPC_BIND: ${NEURAI_RPC_BIND:-127.0.0.1}
      NEURAI_RPC_ALLOW_IP: ${NEURAI_RPC_ALLOW_IP:-127.0.0.1}
      NEURAI_RPC_THREADS: ${NEURAI_RPC_THREADS:-4}
      NEURAI_RPC_WORK_QUEUE: ${NEURAI_RPC_WORK_QUEUE:-16}
      NEURAI_TXINDEX: ${NEURAI_TXINDEX:-0}
      NEURAI_ASSETINDEX: ${NEURAI_ASSETINDEX:-0}
      NEURAI_ADDRESSINDEX: ${NEURAI_ADDRESSINDEX:-0}
      NEURAI_TIMESTAMPINDEX: ${NEURAI_TIMESTAMPINDEX:-0}
      NEURAI_SPENTINDEX: ${NEURAI_SPENTINDEX:-0}
      NEURAI_REST: ${NEURAI_REST:-0}
      NEURAI_PRUNE: ${NEURAI_PRUNE:-0}
      NEURAI_MAX_CONNECTIONS: ${NEURAI_MAX_CONNECTIONS:-125}
      NEURAI_DB_CACHE: ${NEURAI_DB_CACHE:-450}
      NEURAI_SCRIPT_THREADS: ${NEURAI_SCRIPT_THREADS:-0}
      NEURAI_MAX_MEMPOOL: ${NEURAI_MAX_MEMPOOL:-300}
      NEURAI_PERSIST_MEMPOOL: ${NEURAI_PERSIST_MEMPOOL:-1}
      NEURAI_DISABLE_WALLET: ${NEURAI_DISABLE_WALLET:-0}
      NEURAI_WALLET_FILE: ${NEURAI_WALLET_FILE:-}
      NEURAI_WALLET_BROADCAST: ${NEURAI_WALLET_BROADCAST:-1}
      NEURAI_WALLET_RBF: ${NEURAI_WALLET_RBF:-0}
      NEURAI_RPC_USER: ${NEURAI_RPC_USER:-}
      NEURAI_RPC_PASSWORD: ${NEURAI_RPC_PASSWORD:-}
      NEURAI_ZMQ_PUB_HASH_BLOCK: ${NEURAI_ZMQ_PUB_HASH_BLOCK:-}
      NEURAI_ZMQ_PUB_HASH_TX: ${NEURAI_ZMQ_PUB_HASH_TX:-}
      NEURAI_ZMQ_PUB_RAW_BLOCK: ${NEURAI_ZMQ_PUB_RAW_BLOCK:-}
      NEURAI_ZMQ_PUB_RAW_TX: ${NEURAI_ZMQ_PUB_RAW_TX:-}
      NEURAI_ZMQ_PUB_RAW_MESSAGE: ${NEURAI_ZMQ_PUB_RAW_MESSAGE:-}
      NEURAI_EXTRA_CONF: ${NEURAI_EXTRA_CONF:-}
    volumes:
      - neurai-data:/data

volumes:
  neurai-data:
